<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="900" fill="#0A0A0B"/>

  <text x="24" y="32" fill="#9A9A96" font-size="13">buttons: four confirmed states. very subtle top highlight. flush edge-to-edge with 1px hairlines, no gaps.</text>
  <g>
    <rect x="24" y="58" width="120" height="28" fill="#242422"/>
    <rect x="24" y="54" width="120" height="28" fill="#2C2C2A"/>
    <rect x="24" y="54" width="120" height="2" fill="#343432"/>
    <text x="84" y="72" fill="#F2F2F0" font-size="11" font-weight="600" text-anchor="middle">UNFOCUSED</text>

    <rect x="146" y="58" width="120" height="28" fill="#2C2C2A"/>
    <rect x="146" y="54" width="120" height="28" fill="#4C4C48"/>
    <rect x="146" y="54" width="120" height="2" fill="#54544F"/>
    <text x="206" y="72" fill="#F2F2F0" font-size="11" font-weight="600" text-anchor="middle">HOVERED</text>

    <rect x="268" y="83" width="120" height="1" fill="#7A1420"/>
    <rect x="268" y="56" width="120" height="27" fill="#C4202E"/>
    <rect x="268" y="56" width="120" height="2" fill="#E86870"/>
    <text x="328" y="73" fill="#F2F2F0" font-size="11" font-weight="600" text-anchor="middle">PRESSED</text>
    <text x="328" y="100" fill="#9A9A96" font-size="10" text-anchor="middle">sinks 4px: momentary click</text>

    <rect x="390" y="83" width="120" height="3" fill="#7A1420"/>
    <rect x="390" y="54" width="120" height="29" fill="#C4202E"/>
    <rect x="390" y="54" width="120" height="2" fill="#D8505A"/>
    <text x="450" y="72" fill="#F2F2F0" font-size="11" font-weight="600" text-anchor="middle">SELECTED</text>
    <text x="450" y="100" fill="#9A9A96" font-size="10" text-anchor="middle">same footprint as resting</text>
  </g>

  <text x="24" y="150" fill="#9A9A96" font-size="13">palette chips: unfocused, hovered (lighten only), pressed (hover's lighten + 3px lift + 7px shadow)</text>
  <g>
    <rect x="24" y="168" width="70" height="36" fill="#378ADD"/>
    <rect x="24" y="204" width="70" height="5" fill="#185F9C"/>
    <text x="59" y="226" fill="#9A9A96" font-size="10" text-anchor="middle">unfocused</text>

    <rect x="106" y="168" width="70" height="36" fill="#4E9EE8"/>
    <rect x="106" y="204" width="70" height="5" fill="#185F9C"/>
    <text x="141" y="226" fill="#9A9A96" font-size="10" text-anchor="middle">hovered</text>

    <rect x="188" y="165" width="70" height="36" fill="#4E9EE8"/>
    <rect x="188" y="201" width="70" height="7" fill="#185F9C"/>
    <text x="223" y="226" fill="#9A9A96" font-size="10" text-anchor="middle">pressed</text>
  </g>
  <text x="24" y="250" fill="#6B6B68" font-size="11">no primary/secondary selection indicator yet: several approaches tried and rejected, deliberately deferred. do not invent one.</text>

  <text x="24" y="300" fill="#9A9A96" font-size="13">layers panel: full anatomy: add button, thumbnails (checkerboard, aspect-correct), labels, delete pip, hidden overlay</text>
  <g>
    <rect x="24" y="316" width="240" height="2" fill="#343432"/>
    <rect x="24" y="318" width="240" height="26" fill="#2C2C2A"/>
    <text x="144" y="335" fill="#F2F2F0" font-size="13" text-anchor="middle">+</text>
    <rect x="24" y="344" width="240" height="4" fill="#242422"/>

    <rect x="24" y="348" width="240" height="42" fill="#C4202E"/>
    <g>
      <rect x="24" y="348" width="42" height="42" fill="#CFCFCF"/>
      <rect x="45" y="348" width="21" height="21" fill="#DEDEDE"/>
      <rect x="24" y="369" width="21" height="21" fill="#DEDEDE"/>
    </g>
    <text x="76" y="373" fill="#F2F2F0" font-size="13">outline (active: full red row)</text>

    <g>
      <rect x="24" y="390" width="42" height="42" fill="#CFCFCF" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
      <rect x="45" y="390" width="21" height="21" fill="#DEDEDE"/>
      <rect x="24" y="411" width="21" height="21" fill="#DEDEDE"/>
      <circle cx="45" cy="411" r="4" fill="#F2F2F0"/>
    </g>
    <rect x="66" y="390" width="176" height="42" fill="#2A2A2E"/>
    <text x="76" y="415" fill="#F2F2F0" font-size="13">shading (hover: eye pip shown)</text>
    <rect x="242" y="390" width="42" height="42" fill="#1A1A1D"/>
    <rect x="260" y="408" width="8" height="8" fill="#C4202E"/>
    <text x="290" y="415" fill="#9A9A96" font-size="10">delete: minimal pip</text>

    <g>
      <rect x="24" y="432" width="42" height="42" fill="#CFCFCF" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
      <rect x="45" y="432" width="21" height="21" fill="#DEDEDE"/>
      <rect x="24" y="453" width="21" height="21" fill="#DEDEDE"/>
    </g>
    <rect x="66" y="432" width="176" height="42" fill="#1A1A1D"/>
    <text x="76" y="457" fill="#B4B2A9" font-size="13">midtones (resting)</text>

    <g>
      <rect x="24" y="474" width="42" height="42" fill="#CFCFCF" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
      <rect x="45" y="474" width="21" height="21" fill="#DEDEDE"/>
      <rect x="24" y="495" width="21" height="21" fill="#DEDEDE"/>
      <rect x="24" y="474" width="42" height="42" fill="rgba(0,0,0,0.55)"/>
      <circle cx="45" cy="495" r="4" fill="#F2F2F0"/>
    </g>
    <rect x="66" y="474" width="176" height="42" fill="#1A1A1D"/>
    <text x="76" y="499" fill="#6B6B68" font-size="13">background (hidden: overlay + persistent pip)</text>
  </g>

  <text x="24" y="560" fill="#6B6B68" font-size="11">thumbnail hairline: 30% black. label hairline: 10% black. these are deliberately different: see doc §4.3.</text>
  <text x="24" y="580" fill="#6B6B68" font-size="11">corner radius: 0px everywhere. all shadows/ledges are darker shades of the element's own fill, never generic black.</text>
</svg>
