<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self';">
  <title>Sprite</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
  <div id="app">
    <div id="canvas-area">
      <canvas id="sprite-canvas"></canvas>
    </div>

    <div id="timeline-trigger" class="edge-trigger edge-trigger-top"></div>
    <div id="timeline-bar" class="panel-overlay panel-overlay-top panel-hidden"></div>

    <div id="project-trigger" class="edge-trigger edge-trigger-left"></div>
    <div id="project-panel" class="side-panel panel-overlay panel-overlay-left panel-hidden"></div>
    <div id="export-panel" class="side-panel panel-overlay panel-overlay-left panel-hidden"></div>
    <div id="open-project-panel" class="side-panel panel-overlay panel-overlay-left panel-hidden"></div>

    <div id="layers-panel" class="side-panel panel-overlay panel-overlay-right panel-hidden"></div>
    <div id="layers-trigger" class="edge-trigger edge-trigger-right"></div>

    <div id="palette-trigger" class="edge-trigger edge-trigger-bottom"></div>
    <div id="palette-bar" class="panel-overlay panel-overlay-bottom"></div>

    <div id="version-tab"></div>
    <div id="tool-tag"></div>
    <div id="kb-focus-ring"></div>
  </div>
  <script>
    // A failed startup otherwise leaves a blank page with the reason only in
    // the console; print the first error on the page (click to dismiss).
    for (const type of ['error', 'unhandledrejection']) {
      window.addEventListener(type, (e) => {
        const reason = e.reason || e.error;
        const text = (reason && reason.stack) || (reason && reason.message) || e.message || String(reason);
        const box = document.getElementById('startup-error') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'startup-error' }));
        box.style.cssText = 'position:fixed;inset:0 0 auto 0;z-index:99999;margin:0;padding:8px;max-height:50vh;overflow:auto;background:#7A0C18;color:#fff;font:12px monospace;white-space:pre-wrap;cursor:pointer';
        box.textContent += (box.textContent ? '\n\n' : '') + text;
        box.onclick = () => box.remove();
      });
    }
  </script>
  <script type="module" src="src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
    }
  </script>
</body>
</html>
